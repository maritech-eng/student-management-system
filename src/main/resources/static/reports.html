<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports - Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>@media print { .no-print { display:none !important; } .sidebar,.topbar{display:none!important;} .main-content{margin-left:0!important;} }</style>
</head>
<body>
<div id="sidebarContainer"></div>
<div class="main-content" id="mainContent">
  <nav class="topbar d-flex justify-content-between align-items-center px-3 no-print">
    <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0"><i class="bi bi-graph-up me-2"></i>Reports</h5>
    <div id="userBadge" class="small text-muted"></div>
  </nav>

  <div class="container-fluid py-4">
    <div class="card shadow-sm no-print mb-3">
      <div class="card-body d-flex flex-wrap gap-2 align-items-center">
        <label class="me-2 mb-0">Report:</label>
        <select id="reportType" class="form-select" style="max-width:260px;">
          <option value="students">Student List</option>
          <option value="attendance">Attendance</option>
          <option value="fees">Fees</option>
          <option value="results">Results</option>
          <option value="library-books">Library - Books</option>
          <option value="hostel-allocations">Hostel Allocations</option>
          <option value="placements">Placements</option>
        </select>
        <button class="btn btn-outline-secondary" onclick="loadReport()"><i class="bi bi-arrow-clockwise"></i> Load</button>
        <button class="btn btn-outline-primary" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
        <button class="btn btn-outline-success" onclick="exportCsv()"><i class="bi bi-file-earmark-spreadsheet"></i> Export CSV (Excel)</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h5 id="reportTitle">Student List</h5>
        <div class="table-responsive">
          <table class="table table-bordered table-sm" id="reportTable">
            <thead class="table-light"><tr id="reportHeader"></tr></thead>
            <tbody id="reportBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
