<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fees - Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebarContainer"></div>
<div class="main-content" id="mainContent">
  <nav class="topbar d-flex justify-content-between align-items-center px-3">
    <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0"><i class="bi bi-cash-coin me-2"></i>Fees</h5>
    <div id="userBadge" class="small text-muted"></div>
  </nav>
  <div class="container-fluid py-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div class="input-group" style="max-width:320px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="searchInput" class="form-control" placeholder="Search Fees...">
          </div>
          <button class="btn btn-primary add-btn" onclick="openAddModal()"><i class="bi bi-plus-lg"></i> Add Fee Record</button>
        </div>
        <div id="alertBox"></div>
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="dataTable">
            <thead class="table-light">
              <tr>
                <th style="cursor:pointer" onclick="sortBy('studentId')">Student Id <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('academicYear')">Academic Year <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('totalFee')">Total Fee <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('paidAmount')">Paid Amount <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('pendingAmount')">Pending Amount <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('paymentStatus')">Payment Status <i class="bi bi-arrow-down-up small"></i></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <nav>
          <ul class="pagination justify-content-end" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="formModalTitle">Add Fee Record</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="formError" class="alert alert-danger d-none"></div>
        <form id="entityForm" class="row">
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Student Id</label>
      <input type="text" class="form-control" id="f_studentId">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Academic Year</label>
      <input type="text" class="form-control" id="f_academicYear">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Semester</label>
      <input type="number" class="form-control" id="f_semester">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Tuition Fee</label>
      <input type="number" class="form-control" id="f_tuitionFee">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Exam Fee</label>
      <input type="number" class="form-control" id="f_examFee">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Hostel Fee</label>
      <input type="number" class="form-control" id="f_hostelFee">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Transport Fee</label>
      <input type="number" class="form-control" id="f_transportFee">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Other Fee</label>
      <input type="number" class="form-control" id="f_otherFee">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Paid Amount</label>
      <input type="number" class="form-control" id="f_paidAmount">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Payment Date</label>
      <input type="date" class="form-control" id="f_paymentDate">
    </div></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveEntity()"><i class="bi bi-check-lg"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<!-- View Modal -->
<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Fee Record Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/fees.js"></script>
</body>
</html>
