<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
  <div class="card login-card">
    <div class="card-body p-4">
      <div class="text-center mb-3">
        <i class="bi bi-person-plus-fill" style="font-size:2.5rem;color:#4f46e5;"></i>
        <h4 class="mt-2 mb-0">Create Student Account</h4>
        <div class="text-muted small">Self-registration always creates a STUDENT login. Staff/Faculty/Admin accounts are created by an administrator.</div>
      </div>

      <div id="regError" class="alert alert-danger d-none"></div>
      <div id="regSuccess" class="alert alert-success d-none"></div>

      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" minlength="6" required>
          <div class="form-text">At least 6 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-check-lg"></i> Register
        </button>
      </form>

      <div class="text-center mt-3 small">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("regError");
  const successBox = document.getElementById("regSuccess");
  errorBox.classList.add("d-none");
  successBox.classList.add("d-none");

  try {
    const payload = {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    };
    const res = await fetch("/api/auth/register", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(typeof data === "string" ? data : (data.message || "Registration failed"));
    }
    successBox.textContent = "Account created! Redirecting to login...";
    successBox.classList.remove("d-none");
    setTimeout(() => window.location.href = "login.html", 1200);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  }
});
</script>
</body>
</html>
