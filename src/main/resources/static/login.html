<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
  <div class="card login-card">
    <div class="card-body p-4">
      <div class="text-center mb-3">
        <i class="bi bi-mortarboard-fill" style="font-size:2.5rem;color:#4f46e5;"></i>
        <h4 class="mt-2 mb-0">Student Management System</h4>
        <div class="text-muted small">Sign in to continue</div>
      </div>

      <div id="loginError" class="alert alert-danger d-none"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>

      <div class="text-center mt-3 small">
        New student? <a href="register.html">Create an account</a>
      </div>

      <hr>
      <div class="demo-creds">
        <strong>Demo credentials</strong>
        <table class="table table-sm mb-0 mt-1">
          <tbody>
            <tr><td>Super Admin</td><td>admin@example.com</td><td>Admin@123</td></tr>
            <tr><td>Staff</td><td>staff@example.com</td><td>Staff@123</td></tr>
            <tr><td>Faculty</td><td>faculty@example.com</td><td>Faculty@123</td></tr>
            <tr><td>Student</td><td>student@example.com</td><td>Student@123</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("loginError");
  errorBox.classList.add("d-none");
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const res = await fetch("/api/auth/login", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.message || "Invalid email or password");
    }
    sessionStorage.setItem("currentUser", JSON.stringify(data));
    window.location.href = "dashboard.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
  }
});

// If already logged in, skip straight to the dashboard.
(async () => {
  try {
    const res = await fetch("/api/auth/me", { credentials: "include" });
    if (res.ok) window.location.href = "dashboard.html";
  } catch (e) { /* not logged in - stay on login page */ }
})();
</script>
</body>
</html>
