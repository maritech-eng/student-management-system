<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings - Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebarContainer"></div>
<div class="main-content" id="mainContent">
  <nav class="topbar d-flex justify-content-between align-items-center px-3">
    <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0"><i class="bi bi-gear me-2"></i>Account Settings</h5>
    <div id="userBadge" class="small text-muted"></div>
  </nav>
  <div class="container-fluid py-4">
    <div class="card shadow-sm" style="max-width:480px;">
      <div class="card-body">
        <h6>Change Password</h6>
        <div id="alertBox"></div>
        <form id="pwForm">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-control" id="currentPassword" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" minlength="6" required>
          </div>
          <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Update Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
requireAuth();

document.getElementById("pwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const box = document.getElementById("alertBox");
  try {
    const res = await fetch("/api/auth/change-password", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        currentPassword: document.getElementById("currentPassword").value,
        newPassword: document.getElementById("newPassword").value
      })
    });
    const text = await res.text();
    if (!res.ok) throw new Error(text);
    box.innerHTML = `<div class="alert alert-success">${text}</div>`;
    document.getElementById("pwForm").reset();
  } catch (err) {
    box.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
});
</script>
</body>
</html>
