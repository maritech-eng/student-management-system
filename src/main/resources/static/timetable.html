<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable - Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebarContainer"></div>
<div class="main-content" id="mainContent">
  <nav class="topbar d-flex justify-content-between align-items-center px-3">
    <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0"><i class="bi bi-calendar3 me-2"></i>Timetable</h5>
    <div id="userBadge" class="small text-muted"></div>
  </nav>
  <div class="container-fluid py-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div class="input-group" style="max-width:320px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="searchInput" class="form-control" placeholder="Search Timetable...">
          </div>
          <button class="btn btn-primary add-btn" onclick="openAddModal()"><i class="bi bi-plus-lg"></i> Add Timetable Entry</button>
        </div>
        <div id="alertBox"></div>
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="dataTable">
            <thead class="table-light">
              <tr>
                <th style="cursor:pointer" onclick="sortBy('departmentId')">Department Id <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('semester')">Semester <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('section')">Section <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('day')">Day <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('time')">Time <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('subjectId')">Subject Id <i class="bi bi-arrow-down-up small"></i></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <nav>
          <ul class="pagination justify-content-end" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="formModalTitle">Add Timetable Entry</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="formError" class="alert alert-danger d-none"></div>
        <form id="entityForm" class="row">
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Department Id</label>
      <input type="text" class="form-control" id="f_departmentId">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Course Id</label>
      <input type="text" class="form-control" id="f_courseId">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Semester</label>
      <input type="number" class="form-control" id="f_semester">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Section</label>
      <input type="text" class="form-control" id="f_section">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
          <label class="form-label">Day</label>
          <select class="form-select" id="f_day">
            <option value="">-- Select --</option>
            <option value="Monday">Monday</option>\n<option value="Tuesday">Tuesday</option>\n<option value="Wednesday">Wednesday</option>\n<option value="Thursday">Thursday</option>\n<option value="Friday">Friday</option>\n<option value="Saturday">Saturday</option>
          </select>
        </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Time</label>
      <input type="text" class="form-control" id="f_time">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Subject Id</label>
      <input type="text" class="form-control" id="f_subjectId">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Faculty Id</label>
      <input type="text" class="form-control" id="f_facultyId">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Room Number</label>
      <input type="text" class="form-control" id="f_roomNumber">
    </div></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveEntity()"><i class="bi bi-check-lg"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<!-- View Modal -->
<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Timetable Entry Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/timetable.js"></script>
</body>
</html>
