<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile - Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebarContainer"></div>
<div class="main-content" id="mainContent">
  <nav class="topbar d-flex justify-content-between align-items-center px-3">
    <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0"><i class="bi bi-person-circle me-2"></i>My Profile</h5>
    <div id="userBadge" class="small text-muted"></div>
  </nav>
  <div class="container-fluid py-4">
    <div class="card shadow-sm" style="max-width:480px;">
      <div class="card-body">
        <table class="table table-borderless mb-0" id="profileTable">
          <tr><th>Name</th><td id="pName">-</td></tr>
          <tr><th>Email</th><td id="pEmail">-</td></tr>
          <tr><th>Role</th><td id="pRole">-</td></tr>
        </table>
        <a href="settings.html" class="btn btn-outline-primary btn-sm mt-2"><i class="bi bi-gear"></i> Account Settings</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
requireAuth().then(user => {
  document.getElementById("pName").textContent = user.name;
  document.getElementById("pEmail").textContent = user.email;
  document.getElementById("pRole").textContent = user.role;
});
</script>
</body>
</html>
