<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Requests - Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebarContainer"></div>
<div class="main-content" id="mainContent">
  <nav class="topbar d-flex justify-content-between align-items-center px-3">
    <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <h5 class="mb-0"><i class="bi bi-envelope-paper me-2"></i>Leave Requests</h5>
    <div id="userBadge" class="small text-muted"></div>
  </nav>
  <div class="container-fluid py-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div class="input-group" style="max-width:320px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="searchInput" class="form-control" placeholder="Search Leave Requests...">
          </div>
          <button class="btn btn-primary add-btn keep-for-student" onclick="openAddModal()"><i class="bi bi-plus-lg"></i> Add Leave Request</button>
        </div>
        <div id="alertBox"></div>
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="dataTable">
            <thead class="table-light">
              <tr>
                <th style="cursor:pointer" onclick="sortBy('applicantId')">Applicant Id <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('applicantType')">Applicant Type <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('fromDate')">From Date <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('toDate')">To Date <i class="bi bi-arrow-down-up small"></i></th>
                <th style="cursor:pointer" onclick="sortBy('status')">Status <i class="bi bi-arrow-down-up small"></i></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <nav>
          <ul class="pagination justify-content-end" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="formModalTitle">Add Leave Request</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="formError" class="alert alert-danger d-none"></div>
        <form id="entityForm" class="row">
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">Applicant Id</label>
      <input type="text" class="form-control" id="f_applicantId">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
          <label class="form-label">Applicant Type</label>
          <select class="form-select" id="f_applicantType">
            <option value="">-- Select --</option>
            <option value="STUDENT">STUDENT</option>\n<option value="STAFF">STAFF</option>\n<option value="FACULTY">FACULTY</option>
          </select>
        </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">From Date</label>
      <input type="date" class="form-control" id="f_fromDate">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
      <label class="form-label">To Date</label>
      <input type="date" class="form-control" id="f_toDate">
    </div></div>
          <div class="col-md-6"><div class="mb-3">
          <label class="form-label">Reason</label>
          <textarea class="form-control" id="f_reason" rows="2"></textarea>
        </div></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveEntity()"><i class="bi bi-check-lg"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<!-- View Modal -->
<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Leave Request Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/leave.js"></script>
</body>
</html>
