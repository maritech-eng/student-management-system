spring.application.name=student-management-system

# ---- Server ----
server.port=${PORT:8080}

# ---- MongoDB ----
# Make sure MongoDB is running locally before starting the app (see mongodb-setup.md)
spring.data.mongodb.uri=${MONGODB_URI}
# ---- File upload (student photos) ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.example.studentmanagement=INFO
# Never log passwords or other secrets - keep this at INFO/WARN in production
